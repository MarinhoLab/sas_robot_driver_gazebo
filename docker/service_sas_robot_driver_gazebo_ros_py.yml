services:
  sas_robot_driver_gazebo_ros_py:
    build: .
    volumes:
      - ../../sas_robot_driver_gazebo:/root/sas_robot_driver_gazebo_devel/src/sas_robot_driver_gazebo
    command: /bin/bash -c "
      cd /root/sas_robot_driver_gazebo_devel
      && ls .
      && colcon build
      && source install/setup.bash
      && ros2 run sas_robot_driver_gazebo sas_robot_driver_ros_gazebo.py"
